# Keep appId in sync with electronApp.setAppUserModelId() in src/main/index.ts.
# Changing it after release breaks auto-update identity, so settle the product
# name before shipping.
appId: com.jimmyneville.os-inventory
productName: OS Inventory
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,todos.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: os-inventory
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  entitlementsInherit: build/entitlements.mac.plist
  # No extendInfo: the app uses no camera, microphone, Documents or Downloads
  # access, so it must not declare usage strings asking for them.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Jimmy Neville <jimmyeneville@gmail.com>
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Jneville0815
  repo: os-inventory
