<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1b2030"/>
      <stop offset="1" stop-color="#080a12"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#7dfcb0"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="26" flood-color="#2fbf71" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- version bump -->
  <g filter="url(#glow)">
    <path d="M312 455 L512 255 L712 455" fill="none" stroke="url(#lime)"
          stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the inventory it applies to -->
  <g fill="#f4ecdc">
    <rect x="296" y="575" width="432" height="58" rx="29"/>
    <rect x="335" y="667" width="354" height="58" rx="29" opacity="0.66"/>
    <rect x="383" y="759" width="258" height="58" rx="29" opacity="0.4"/>
  </g>
</svg>
